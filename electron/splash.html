<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 26, 0.95);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #fff;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .logo {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 4px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #0078d4, #00b7c3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
    }
    .loader {
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: #0078d4;
      border-radius: 2px;
      animation: loading 1.5s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div class="logo">123看图</div>
  <div class="subtitle">极致轻量 · 图片/PDF 查看器</div>
  <div class="loader">
    <div class="loader-bar"></div>
  </div>
</body>
</html>
