appId: com.123viewer.app
productName: 123看图
directories:
  output: release

files:
  - electron/**/*
  - dist/**/*
  - 123.ico
  - package.json
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/wallpaper/**/*

asar:
  smartUnpack: true

asarUnpack:
  - "node_modules/sharp/**"
  - "node_modules/@img/**"
  - "node_modules/wallpaper/**"

win:
  target:
    - nsis
    - msi
  icon: 123.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: 123.ico
  uninstallerIcon: 123.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false

msi:
  perMachine: false

fileAssociations:
  - ext: jpg
    name: JPEG Image
    description: 123看图 - JPEG 图片
  - ext: jpeg
    name: JPEG Image
    description: 123看图 - JPEG 图片
  - ext: png
    name: PNG Image
    description: 123看图 - PNG 图片
  - ext: webp
    name: WebP Image
    description: 123看图 - WebP 图片
  - ext: bmp
    name: BMP Image
    description: 123看图 - BMP 图片
  - ext: tiff
    name: TIFF Image
    description: 123看图 - TIFF 图片
  - ext: tif
    name: TIFF Image
    description: 123看图 - TIFF 图片
  - ext: gif
    name: GIF Image
    description: 123看图 - GIF 图片
  - ext: ico
    name: Icon
    description: 123看图 - ICO 图标
  - ext: svg
    name: SVG Image
    description: 123看图 - SVG 矢量图
  - ext: pdf
    name: PDF Document
    description: 123看图 - PDF 文档